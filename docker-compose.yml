services:
  api:
    build: .
    environment:
      MODEL_PATH: /models/model.joblib
      REDIS_HOST: redis
      MODEL_VERSION: v1-stable
      PYTHONUNBUFFERED: 1
    volumes:
      - ./models:/models:ro
    restart: unless-stopped
  api_canary:
    build: .
    environment:
      MODEL_PATH: /models/model.joblib
      REDIS_HOST: redis
      MODEL_VERSION: v2-canary
      PYTHONUNBUFFERED: 1
    volumes:
      - ./models:/models:ro
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    restart: unless-stopped
  nginx:
    image: nginx:alpine
    ports:
      - "8090:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - api_canary
    restart: unless-stopped
