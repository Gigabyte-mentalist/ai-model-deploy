events { worker_connections 1024; }

http {
    upstream model_backend {
        server api:8000 weight=9;
        server api_canary:8000 weight=1;
    }

    server {
        listen 80;
        location / {
            proxy_pass http://model_backend;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
        }
    }
}
